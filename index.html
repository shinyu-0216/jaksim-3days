<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>작심삼일 ∞</title>
<meta name="theme-color" content="#e8531e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="작심삼일">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<style>
  :root {
    --bg: #f4f1ea;
    --paper: #fbfaf6;
    --ink: #1c1c1a;
    --muted: #8a867b;
    --line: #d9d4c7;
    --accent: #e8531e;      /* 달력 주황 */
    --done: #2f7d4f;
    --done-bg: #dcefe2;
    --today: #1c1c1a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    padding: 24px 16px 60px;
  }
  .wrap { max-width: 1080px; margin: 0 auto; }

  header { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .eyebrow { font-size: 11px; letter-spacing: .18em; color: var(--done); font-weight: 700; }
  h1 { margin: 2px 0 0; font-size: 28px; }
  .inf { color: var(--accent); font-size: 1.15em; margin-left: 2px; }
  .stats { display: flex; gap: 8px; }
  .stat { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 8px 14px; text-align: center; min-width: 78px; }
  .stat b { display: block; font-size: 20px; color: var(--done); }
  .stat span { font-size: 11px; color: var(--muted); }

  /* 달력 카드 */
  .calendar { background: var(--paper); border-radius: 14px; border-top: 6px solid var(--accent); box-shadow: 0 2px 10px rgba(0,0,0,.08); padding: 18px 18px 22px; }
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; gap: 8px; }
  .cal-title { text-align: center; flex: 1; }
  .cal-title .m { font-size: 34px; font-weight: 900; color: var(--accent); letter-spacing: .02em; line-height: 1; }
  .cal-title .y { font-size: 15px; font-weight: 700; margin-top: 4px; }
  .nav { border: 1px solid var(--line); background: #fff; border-radius: 8px; width: 40px; height: 40px; font-size: 18px; cursor: pointer; }
  .nav:hover { background: #f0ece0; }
  .today-btn { border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 0 12px; height: 40px; cursor: pointer; font-size: 13px; }

  .grid { display: grid; grid-template-columns: repeat(7, 1fr); border-top: 2px solid var(--ink); }
  .dow { text-align: center; font-size: 12px; font-weight: 800; padding: 8px 0; border-bottom: 1px solid var(--ink); letter-spacing: .05em; }
  .dow.we { color: var(--accent); }
  .cell { min-height: 112px; border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); padding: 6px 6px 8px; position: relative; display: flex; flex-direction: column; gap: 6px; }
  .cell:nth-child(7n+14) { border-right: none; }
  .cell.empty { background: repeating-linear-gradient(45deg, transparent 0 8px, rgba(0,0,0,.02) 8px 16px); }
  .num { font-size: 20px; font-weight: 900; line-height: 1; }
  .cell.we .num { color: var(--accent); }
  .cell.today .num { background: var(--today); color: #fff; border-radius: 50%; width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center; font-size: 15px; }
  .cell.perfect { background: var(--done-bg); }
  .chips { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
  .chip { width: 100%; height: 36px; border-radius: 8px; border: 1px solid var(--line); background: #fff; cursor: pointer; padding: 0; color: #b3aea0; display: flex; align-items: center; justify-content: center; transition: .12s; }
  .chip svg { width: 24px; height: 24px; }
  .chip:hover { color: #6f6b60; transform: translateY(-1px); }
  .chip.on { color: var(--done); background: var(--done-bg); border-color: var(--done); box-shadow: inset 0 0 0 1px var(--done); }
  .bar { margin-top: auto; height: 4px; background: #e8e4d8; border-radius: 2px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--done); width: 0; transition: width .2s; }

  /* 습관 관리 */
  .panel { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; margin-top: 16px; }
  .panel h2 { margin: 0 0 12px; font-size: 15px; }
  .habit-row { display: grid; grid-template-columns: 28px 1fr 2fr 50px 28px; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px dashed var(--line); font-size: 14px; }
  .habit-row:last-of-type { border-bottom: none; }
  .meter { height: 8px; background: #e8e4d8; border-radius: 4px; overflow: hidden; }
  .meter i { display: block; height: 100%; background: var(--done); }
  .pct { text-align: right; font-weight: 700; color: var(--done); font-size: 13px; }
  .del { border: none; background: none; color: var(--muted); cursor: pointer; font-size: 16px; }
  .del:hover { color: #c0392b; }
  .add { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .add input { border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; font-size: 14px; background: #fff; font-family: inherit; }
  .add .emo { width: 84px; border: 1px solid var(--line); border-radius: 8px; padding: 9px 6px; font-size: 14px; background: #fff; font-family: inherit; }
  .ico svg { width: 20px; height: 20px; display: block; color: var(--done); }
  .add input.nm { flex: 1; min-width: 140px; }
  .btn { border: 1px solid var(--done); background: var(--done); color: #fff; border-radius: 8px; padding: 9px 16px; font-size: 14px; cursor: pointer; font-family: inherit; }
  .btn.ghost { background: #fff; color: var(--done); }
  .btn.danger { background: #fff; color: #c0392b; border-color: #e3b5ae; }
  .tools { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }
  .hint { color: var(--muted); font-size: 12px; margin: 10px 0 0; }

  @media (max-width: 720px) {
    .cell { min-height: 84px; padding: 4px; }
    .num { font-size: 15px; }
    .cell.today .num { width: 22px; height: 22px; font-size: 12px; }
    .chip { height: 22px; border-radius: 5px; } .chip svg { width: 14px; height: 14px; }
    .chips { gap: 2px; }
    .cal-title .m { font-size: 26px; }
    .habit-row { grid-template-columns: 24px 1fr 44px 24px; }
    .habit-row .meter { display: none; }
    .calendar { padding: 12px 8px 14px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="eyebrow">HABIT TRACKER · 3일씩, 무한 반복</div>
      <h1>작심삼일 <span class="inf">∞</span></h1>
    </div>
    <div class="stats">
      <div class="stat"><b id="sHabits">0</b><span>습관 개수</span></div>
      <div class="stat"><b id="sDone">0</b><span>이번 달 달성</span></div>
      <div class="stat"><b id="sRate">0%</b><span>달성률</span></div>
    </div>
  </header>

  <section class="calendar">
    <div class="cal-head">
      <button class="nav" id="prev" aria-label="이전 달">‹</button>
      <div class="cal-title"><div class="m" id="mTitle"></div><div class="y" id="yTitle"></div></div>
      <button class="today-btn" id="goToday">오늘</button>
      <button class="nav" id="next" aria-label="다음 달">›</button>
    </div>
    <div class="grid" id="grid"></div>
  </section>

  <section class="panel">
    <h2>내 습관 · 이번 달 달성률</h2>
    <div id="habitList"></div>
    <form class="add" id="addForm">
      <select class="emo" id="newIcon"></select>
      <input class="nm" id="newName" maxlength="20" placeholder="새 습관 이름 (예: 영어 공부)" required>
      <button class="btn" type="submit">+ 습관 추가</button>
    </form>
    <div class="tools">
      <button class="btn ghost" id="csv">⬇ CSV 내보내기</button>
      <button class="btn danger" id="reset">↺ 초기화</button>
    </div>
    <p class="hint">날짜 칸의 아이콘을 누르면 체크/해제됩니다. 데이터는 이 브라우저(localStorage)에만 저장돼요.</p>
  </section>
</div>

<script>
const KEY = 'habit-tracker-calendar-v5';
const DEFAULT_HABITS = [
  { id: 'h3', icon: 'moon',     name: '숙면' },
  { id: 'h7', icon: 'utensils', name: '식단' },
  { id: 'h2', icon: 'dumbbell', name: '운동' },
  { id: 'h1', icon: 'pen',      name: '논문' },
  { id: 'h5', icon: 'piano',    name: '피아노' },
  { id: 'h4', icon: 'palette',  name: '그림' },
];

// 픽토그램 (선 아이콘)
const ICONS = {
  pen:      ['글쓰기',  '<path d="M4 20l1-4L16 5l3 3L8 19z"/><path d="M14 7l3 3"/>'],
  dumbbell: ['운동',    '<rect x="2" y="8.5" width="3" height="7" rx="1"/><rect x="5" y="6" width="3" height="12" rx="1"/><rect x="16" y="6" width="3" height="12" rx="1"/><rect x="19" y="8.5" width="3" height="7" rx="1"/><path d="M8 12h8"/>'],
  utensils: ['식단',    '<ellipse cx="7.5" cy="7" rx="2.8" ry="4"/><path d="M7.5 11v10"/><path d="M15 3l3 18M19 3l3 18"/>'],
  moon:     ['수면',    '<path d="M3 20V10M3 16h18v4M21 16v-2a3 3 0 0 0-3-3h-7v5"/><circle cx="7" cy="13" r="1.8"/><path d="M13 3h5l-5 5h5"/>'],
  palette:  ['그림',    '<path d="M12 3a9 9 0 1 0 0 18c1.500 0 2-1 1.500-2-.6-1.200.2-2.500 1.500-2.500H18a3 3 0 0 0 3-3A9 9 0 0 0 12 3z"/><circle cx="7.500" cy="11" r="1"/><circle cx="10" cy="7" r="1"/><circle cx="15" cy="7" r="1"/>'],
  piano:    ['음악',    '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M9 13v6M15 13v6"/><rect x="7.5" y="5" width="3" height="8" fill="currentColor"/><rect x="13.5" y="5" width="3" height="8" fill="currentColor"/>'],
  leaf:     ['마음',    '<path d="M5 19c0-9 5-14 15-14 0 10-5 15-14 15"/><path d="M5 19l8-8"/>'],
  book:     ['독서',    '<path d="M4 5h6a2 2 0 0 1 2 2v12a2 2 0 0 0-2-2H4zM20 5h-6a2 2 0 0 0-2 2v12a2 2 0 0 1 2-2h6z"/>'],
  drop:     ['물',      '<path d="M12 3s6 6.500 6 11a6 6 0 0 1-12 0c0-4.500 6-11 6-11z"/>'],
  heart:    ['건강',    '<path d="M12 20s-8-5-8-11a4.500 4.500 0 0 1 8-2.500A4.500 4.500 0 0 1 20 9c0 6-8 11-8 11z"/>'],
  star:     ['기타',    '<path d="M12 3l2.800 5.800 6.200.9-4.500 4.400 1.100 6.200L12 17.300 6.400 20.300l1.100-6.200L3 9.700l6.200-.9z"/>'],
  check:    ['체크',    '<path d="M5 12l5 5 9-10"/>'],
};
const svg = n => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${(ICONS[n]||ICONS.check)[1]}</svg>`;

let state = load();
let view = new Date(); view.setDate(1);

function load() {
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.habits) return s; } catch (e) {}
  return { habits: DEFAULT_HABITS.map(h => ({ ...h })), logs: {} };
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

const pad = n => String(n).padStart(2, '0');
const keyOf = (y, m, d) => `${y}-${pad(m + 1)}-${pad(d)}`;
const $ = id => document.getElementById(id);
const MONTHS = ['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE','JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'];
const DOW = ['SUN','MON','TUE','WED','THU','FRI','SAT'];

function isDone(k, id) { return (state.logs[k] || []).includes(id); }
function toggle(k, id) {
  const a = state.logs[k] || [];
  const i = a.indexOf(id);
  if (i >= 0) a.splice(i, 1); else a.push(id);
  if (a.length) state.logs[k] = a; else delete state.logs[k];
  save(); render();
}

function render() {
  const y = view.getFullYear(), m = view.getMonth();
  $('mTitle').textContent = `${m + 1} ${MONTHS[m]}`;
  $('yTitle').textContent = y;

  const first = new Date(y, m, 1);
  const offset = first.getDay();                     // 일요일 시작
  const days = new Date(y, m + 1, 0).getDate();
  const total = Math.ceil((offset + days) / 7) * 7;
  const now = new Date();
  const todayKey = keyOf(now.getFullYear(), now.getMonth(), now.getDate());
  const H = state.habits;

  const g = $('grid'); g.innerHTML = '';
  DOW.forEach((d, i) => {
    const el = document.createElement('div');
    el.className = 'dow' + (i === 0 || i === 6 ? ' we' : ''); el.textContent = d; g.appendChild(el);
  });

  for (let i = 0; i < total; i++) {
    const d = i - offset + 1;
    const cell = document.createElement('div');
    if (d < 1 || d > days) { cell.className = 'cell empty'; g.appendChild(cell); continue; }
    const k = keyOf(y, m, d);
    const cnt = H.filter(h => isDone(k, h.id)).length;
    cell.className = 'cell' + (i % 7 === 0 || i % 7 === 6 ? ' we' : '') + (k === todayKey ? ' today' : '') + (H.length && cnt === H.length ? ' perfect' : '');
    const num = document.createElement('div'); num.className = 'num'; num.textContent = d;
    const chips = document.createElement('div'); chips.className = 'chips';
    H.forEach(h => {
      const b = document.createElement('button');
      b.className = 'chip' + (isDone(k, h.id) ? ' on' : '');
      b.innerHTML = svg(h.icon); b.title = h.name + (isDone(k, h.id) ? ' ✔' : '');
      b.onclick = () => toggle(k, h.id);
      chips.appendChild(b);
    });
    const bar = document.createElement('div'); bar.className = 'bar';
    bar.innerHTML = `<i style="width:${H.length ? cnt / H.length * 100 : 0}%"></i>`;
    cell.append(num, chips, bar);
    g.appendChild(cell);
  }

  // 월간 통계 (현재 달이면 오늘까지, 지난 달이면 전체 일수 기준)
  const isCur = y === now.getFullYear() && m === now.getMonth();
  const elapsed = isCur ? now.getDate() : (new Date(y, m, 1) > now ? 0 : days);
  let doneTotal = 0;
  const list = $('habitList'); list.innerHTML = '';
  H.forEach(h => {
    let c = 0;
    for (let d = 1; d <= days; d++) if (isDone(keyOf(y, m, d), h.id)) c++;
    doneTotal += c;
    const rate = elapsed ? Math.round(c / elapsed * 100) : 0;
    const row = document.createElement('div'); row.className = 'habit-row';
    row.innerHTML = `<span class="ico">${svg(h.icon)}</span><span>${esc(h.name)} <small style="color:var(--muted)">${c}일</small></span>
      <div class="meter"><i style="width:${Math.min(rate,100)}%"></i></div><span class="pct">${rate}%</span>`;
    const del = document.createElement('button'); del.className = 'del'; del.textContent = '✕'; del.title = '삭제';
    del.onclick = () => { if (confirm(`'${h.name}' 습관을 삭제할까요? 기록도 함께 삭제됩니다.`)) removeHabit(h.id); };
    row.appendChild(del); list.appendChild(row);
  });
  $('sHabits').textContent = H.length;
  $('sDone').textContent = doneTotal;
  const possible = H.length * elapsed;
  $('sRate').textContent = (possible ? Math.round(doneTotal / possible * 100) : 0) + '%';
}

function esc(s) { return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function removeHabit(id) {
  state.habits = state.habits.filter(h => h.id !== id);
  for (const k in state.logs) {
    state.logs[k] = state.logs[k].filter(x => x !== id);
    if (!state.logs[k].length) delete state.logs[k];
  }
  save(); render();
}

$('newIcon').innerHTML = Object.entries(ICONS).map(([k, v]) => `<option value="${k}">${v[0]}</option>`).join('');
$('addForm').onsubmit = e => {
  e.preventDefault();
  const name = $('newName').value.trim(); if (!name) return;
  state.habits.push({ id: 'h' + Date.now(), icon: $('newIcon').value, name });
  $('newName').value = ''; save(); render();
};
$('prev').onclick = () => { view.setMonth(view.getMonth() - 1); render(); };
$('next').onclick = () => { view.setMonth(view.getMonth() + 1); render(); };
$('goToday').onclick = () => { view = new Date(); view.setDate(1); render(); };
$('reset').onclick = () => {
  if (confirm('모든 체크 기록을 삭제할까요? (습관 목록은 유지됩니다)')) { state.logs = {}; save(); render(); }
};
$('csv').onclick = () => {
  const y = view.getFullYear(), m = view.getMonth(), days = new Date(y, m + 1, 0).getDate();
  const rows = [['습관', ...Array.from({ length: days }, (_, i) => `${m + 1}/${i + 1}`), '합계']];
  state.habits.forEach(h => {
    const r = Array.from({ length: days }, (_, i) => isDone(keyOf(y, m, i + 1), h.id) ? 1 : 0);
    rows.push([h.name, ...r, r.reduce((a, b) => a + b, 0)]);
  });
  const csv = '﻿' + rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = `habits-${y}-${pad(m + 1)}.csv`; a.click();
};

render();
</script>
</body>
</html>
